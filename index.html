<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汽车直播话术 AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#171717}.wrap{max-width:1250px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0;font-size:30px}.head p{margin:6px 0 0;color:#777}.grid{display:grid;grid-template-columns:410px 1fr;gap:18px}.card{background:white;border:1px solid #e7e7e7;border-radius:16px;padding:19px;box-shadow:0 5px 20px #00000008}.field{margin-bottom:14px}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #ddd;border-radius:9px;padding:10px 11px;font:inherit;font-size:14px}textarea{min-height:85px;resize:vertical}.big{min-height:145px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{border:1px solid #e6e6e6;padding:8px;border-radius:8px;font-size:13px}.check input{width:auto}.btns{display:flex;gap:8px;margin-top:16px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff;flex:1}.secondary{background:#eee}.primary:disabled{opacity:.45;cursor:wait}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.badge{background:#f0f0f0;border-radius:99px;padding:5px 9px;font-size:12px}.out{white-space:pre-wrap;line-height:1.85;font-size:15px;min-height:720px}.hint{text-align:center;color:#aaa;padding-top:180px}.status{font-size:12px;color:#777;margin-top:10px}.mode{display:flex;gap:6px}.mode button{flex:1;font-size:13px}.active{background:#111!important;color:white!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.out{min-height:400px}.head{display:block}}</style></head><body><main class="wrap"><div class="head"><div><h1>汽车直播话术 AI</h1><p>汽车干货直播 · 长篇照读稿 · 参考稿风格学习</p></div><span class="badge">V2</span></div><div class="grid"><section class="card"><div class="field"><label>生成方式</label><div class="mode"><button id="aiMode" class="active" onclick="setMode('ai')">AI 长稿</button><button id="localMode" class="secondary" onclick="setMode('local')">快速提纲</button></div></div><div class="field"><label>任务模式</label><select id="taskMode"><option>完整新稿</option><option>保留原文优化</option><option>只改衔接</option><option>扩写到60分钟</option><option>扩写到90分钟</option></select></div><div class="field"><label>品牌</label><input id="brand" placeholder="丰田 / 大众 / 比亚迪"></div><div class="field"><label>车型</label><input id="model" placeholder="凯美瑞、亚洲龙；可多个"></div><div class="field"><label>直播时长</label><select id="duration"><option value="30">30 分钟</option><option value="60" selected>60 分钟</option><option value="90">90 分钟</option></select></div><div class="field"><label>核心主题</label><textarea id="topic" placeholder="例如：10月行情、各价位怎么选、各车型推荐哪个版本"></textarea></div><div class="field"><label>直播目标</label><div class="checks"><label class="check"><input type="checkbox" id="retain" checked> 提高停留</label><label class="check"><input type="checkbox" id="comment" checked> 评论互动</label><label class="check"><input type="checkbox" id="follow" checked> 关注引导</label><label class="check"><input type="checkbox" id="lead" checked> 自然留资</label></div></div><div class="field"><label>主播风格</label><input id="style" value="口语化、节奏快、像真人主播、少废话、自然互动"></div><div class="field"><label>事实 / 车型资料 / 行情</label><textarea class="big" id="facts" placeholder="粘贴文章、车型配置、行情数据。AI优先使用这里的事实。"></textarea></div><div class="field"><label>参考直播稿</label><textarea class="big" id="reference" placeholder="把你以前效果好的丰田/大众直播稿粘贴进来。选择‘保留原文优化’时会尽量保留原稿。"></textarea></div><div class="btns"><button id="go" class="primary" onclick="generate()">AI 生成完整直播稿</button><button class="secondary" onclick="resetAll()">清空</button></div><div class="status" id="status">AI 模式需要部署后在服务器配置 OPENAI_API_KEY，密钥不会放在浏览器。</div></section><section class="card"><div class="toolbar"><strong>直播稿</strong><div><span class="badge" id="count">0 字</span> <button class="secondary" onclick="copyText(event)">复制全文</button></div></div><div class="out" id="out"><div class="hint">填写左侧信息，点击生成</div></div></section></div></main><script>const $=id=>document.getElementById(id);let mode='ai';function setMode(v){mode=v;$('aiMode').className=v==='ai'?'active':'secondary';$('localMode').className=v==='local'?'active':'secondary';$('go').textContent=v==='ai'?'AI 生成完整直播稿':'生成快速提纲';$('status').textContent=v==='ai'?'AI 模式需要服务器配置 OPENAI_API_KEY，密钥不会放在浏览器。':'快速提纲不调用 AI，可直接使用。'}function data(){const goals=[];if($('retain').checked)goals.push('提高停留');if($('comment').checked)goals.push('评论互动');if($('follow').checked)goals.push('关注引导');if($('lead').checked)goals.push('自然留资');return{brand:$('brand').value,models:$('model').value,duration:+$('duration').value,topic:$('topic').value,goals,style:$('style').value,facts:$('facts').value,reference_script:$('reference').value,mode:$('taskMode').value}}async function generate(){if(mode==='local')return localGenerate();const btn=$('go');btn.disabled=true;btn.textContent='正在生成长稿…';$('out').textContent='AI 正在规划整场直播并生成话术。长稿需要一些时间，请不要重复点击。';$('status').textContent='生成中…';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data())});const j=await r.json();if(!r.ok)throw new Error(j.error||'生成失败');$('out').textContent=j.script||'没有返回内容';$('count').textContent=(j.script||'').length+' 字';$('status').textContent='生成完成 · '+(j.model||'AI')}catch(e){$('out').textContent='生成失败：'+e.message+'\n\n如果还没有部署，请先部署到支持 /api 的服务并配置 OPENAI_API_KEY。';$('status').textContent='生成失败'}finally{btn.disabled=false;btn.textContent='AI 生成完整直播稿'}}function localGenerate(){const d=data(),b=d.brand||'这个品牌',m=d.models||'目标车型';const s=`【开场｜0-3分钟】\n刚进来的朋友，今天围绕${b} ${m}，直接讲${d.topic||'怎么选、版本怎么买、价格怎么看'}。不念参数表，先给结论，再告诉你为什么。正在看的车型直接打公屏。\n\n【车型选择】\n先按预算、用途、家庭人数和通勤场景筛选，再比较车型。不要先被配置表带着走。\n\n【版本选择】\n先看必须配置，再看高频舒适配置，最后才看锦上添花配置。版本差价要问清楚到底买到了什么。\n\n【互动承接】\n把预算+车型+用途打出来，我按“结论→原因→适合谁”的方式继续拆。\n\n【价格逻辑】\n统一比较裸车、税、保险、上牌以及分期成本；置换和地方补贴单独列，不用一个最低价数字替代总成本。\n\n【自然查询】\n先听懂车型和版本，再查自己城市参考行情。查询后按“城市+车型+版本+全款/分期+有无置换”继续比较。`; $('out').textContent=s;$('count').textContent=s.length+' 字'}function copyText(e){navigator.clipboard.writeText($('out').innerText).then(()=>{e.target.textContent='已复制';setTimeout(()=>e.target.textContent='复制全文',1200)})}function resetAll(){['brand','model','topic','facts','reference'].forEach(x=>$(x).value='');$('out').innerHTML='<div class="hint">填写左侧信息，点击生成</div>';$('count').textContent='0 字'}</script></body></html>
